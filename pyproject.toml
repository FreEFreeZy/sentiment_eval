[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment"
version = "0.1.0"
requires-python = "==3.13.9"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "mypy==1.18.2",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "python-multipart==0.0.20",
    "joblib==1.5.2",
    "scikit-learn==1.7.2"
]